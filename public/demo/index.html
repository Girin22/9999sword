<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#17222c" />
    <title>9999+검키우기 — 데모 영상</title>
    <style>
      :root { color-scheme: dark; font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        background: radial-gradient(circle at 50% 20%, #314451 0, #17222c 70%);
        color: #f5e8c8;
        display: flex; flex-direction: column; align-items: center;
        padding: clamp(20px, 5vw, 56px) 16px 48px;
        gap: 22px;
      }
      h1 { margin: 0; font-size: clamp(28px, 6vw, 48px); font-weight: 900; letter-spacing: -0.02em; line-height: 1.1; text-align: center; }
      h1 .num { color: #e9b949; -webkit-text-stroke: 1.5px #293442; }
      p.sub { margin: 0; color: #cdbf9b; font-size: clamp(14px, 2.6vw, 18px); text-align: center; }
      .player {
        width: min(100%, 1080px);
        aspect-ratio: 16 / 9;
        background: #0d151c;
        border: 6px solid #293442;
        border-radius: 28px;
        box-shadow: 0 18px 60px #0008;
        overflow: hidden;
        position: relative;
      }
      .player.portrait { width: min(100%, 460px); aspect-ratio: 9 / 16; }
      .player video, .player iframe { width: 100%; height: 100%; display: block; border: 0; }
      .empty {
        position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
        color: #8fa2ad; font-size: 15px; padding: 24px; line-height: 1.6;
      }
      .empty code { color: #e9b949; }
      a.play {
        display: inline-block; text-decoration: none; font-weight: 800; font-size: 18px; color: #293442;
        background: linear-gradient(#ffe08a, #f5c95d); border: 5px solid #293442; border-radius: 22px;
        padding: 14px 34px; box-shadow: 0 10px 0 #a67f2a, 0 16px 24px #0006; transition: transform .08s, box-shadow .08s;
      }
      a.play:active { transform: translateY(8px); box-shadow: 0 2px 0 #a67f2a, 0 6px 12px #0006; }
      footer { color: #6f8290; font-size: 12px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1><span class="num">9999+</span> 검키우기</h1>
    <p class="sub">검을 강화하고 병사에게 보급하는 세로형 자동 전투 게임 · 데모 플레이 영상</p>

    <div class="player" id="player">
      <div class="empty" id="empty">
        아직 영상이 없습니다.<br />
        <code>public/demo/demo.mp4</code> 를 넣거나, 아래 스크립트의 <code>YOUTUBE_ID</code> 를 채워 주세요.
      </div>
    </div>

    <a class="play" href="/">게임 플레이하기 →</a>
    <footer>OpenAI Game Builders Seoul 2026 출품작 · 이 페이지는 게임 내에서 연결되지 않으며 주소로만 열립니다.</footer>

    <script>
      // ── 영상 소스 설정 ─────────────────────────────────────────────
      // 1) 로컬 파일: public/demo/demo.mp4 (또는 .webm) 을 두면 자동 재생됩니다.
      // 2) 유튜브: 아래 ID를 채우면 유튜브 임베드를 우선 사용합니다. 예) 'dQw4w9WgXcQ'
      const YOUTUBE_ID = '';
      const LOCAL_SRC = '/demo/demo.mp4';
      // 세로 영상이면 true (플레이어가 9:16 세로 프레임으로 바뀝니다)
      const PORTRAIT = true;

      const player = document.getElementById('player');
      const empty = document.getElementById('empty');
      if (PORTRAIT) player.classList.add('portrait');

      if (YOUTUBE_ID) {
        const frame = document.createElement('iframe');
        frame.src = `https://www.youtube-nocookie.com/embed/${YOUTUBE_ID}?rel=0&modestbranding=1&playsinline=1`;
        frame.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
        frame.allowFullscreen = true;
        frame.title = '9999+검키우기 데모 영상';
        empty.remove();
        player.appendChild(frame);
      } else {
        fetch(LOCAL_SRC, { method: 'HEAD' }).then((res) => {
          if (!res.ok || !(res.headers.get('content-type') || '').startsWith('video/')) return;
          const video = document.createElement('video');
          video.src = LOCAL_SRC;
          video.controls = true;
          video.playsInline = true;
          video.preload = 'metadata';
          empty.remove();
          player.appendChild(video);
        }).catch(() => {});
      }
    </script>
  </body>
</html>
